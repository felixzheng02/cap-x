# RoboCasa365 via a remote robot driver. The simulator runs in a SEPARATE process and
# environment (robocasa/capx_sim_server) and is reached over ZeroMQ; this side has no
# robosuite, mujoco or robocasa installed at all.
#
# Launch with ../run_experiment.sh, which starts the simulator for the right task first.
# Ground-truth perception is served BY the simulator on the usual SAM3 port (8114), so the
# SAM3 server is deliberately NOT started here.

env:
  _target_: capx.envs.tasks.remote.robot_kitchen.RemoteRobotKitchenCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: remote_robot_low_level
    privileged: false
    apis:
      - RemoteRobotApi
    multi_turn_prompt: |
      The following code was just executed on the robot:
      ```python
      {executed_code}
      ```
      Console output:
      {console_stdout}
      Errors (empty if none):
      {console_stderr}

      You are also shown the camera view before and after the code ran, and a description of
      what changed. Decide whether the task is complete.

      Reply with EITHER:
      - the word FINISH, if the task appears to be complete; or
      - the word REGENERATE followed by a complete replacement program in a ```python fenced
        block. The replacement runs from the CURRENT robot state, not from the beginning, so
        do not repeat steps that already succeeded.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/robocasa_open_drawer_qwen_multiturn

trials: 1
num_workers: 1

# --- local Qwen3.8-27B (NVFP4) on this machine -------------------------------
# Served by /opt/rail/qwen3.8/bin/qwen-serve. NOTE the /v1 in the path: this repo's
# defaults say /chat/completions, which a vLLM server answers with 404.
# Measured on tender: prompt 1,246 tok; 512x512 image 258 tok; decode 20.0 tok/s.
# max_tokens 4096 => ~205 s worst-case decode, inside the 1200 s HTTP timeout.
model: qwen3.8-27b
server_url: http://127.0.0.1:8000/v1/chat/completions
api_key: EMPTY
max_tokens: 4096
temperature: 0.7
reasoning_effort: medium

# --- multi-turn with visual feedback ----------------------------------------
# The simulator serves ground-truth segmentation on the SAM3 contract, and the same local
# Qwen3.8 serves as the visual-differencing model. Two 512x512 frames cost ~516 tokens
# (measured), so no downscaling is needed against the 32K budget.
use_img_differencing: true
visual_differencing_model: qwen3.8-27b
visual_differencing_model_server_url: http://127.0.0.1:8000/v1/chat/completions
visual_differencing_model_api_key: EMPTY
